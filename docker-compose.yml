services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: laprevia
      POSTGRES_PASSWORD: laprevia
      POSTGRES_DB: laprevia
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laprevia"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  db:
