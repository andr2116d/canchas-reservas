services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: laprevia
      POSTGRES_PASSWORD: laprevia
      POSTGRES_DB: laprevia
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laprevia"]
      interval: 2s
      timeout: 3s
      retries: 20
  # Servidor de correo de prueba: recibe lo que envía la API y lo muestra en http://localhost:8025.
  # No entrega nada a buzones reales. La imagen trae su propia verificación de salud.
  correo:
    image: axllent/mailpit:v1.33.1
    ports:
      - "${SMTP_PUERTO:-1025}:1025"
      - "${CORREO_WEB_PUERTO:-8025}:8025"
volumes:
  db:
